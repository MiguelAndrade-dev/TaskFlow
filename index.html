<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css" />
    <script src="java.js" defer></script>
  </head>
  <body>
    <div class="bemvindo">
      <h1>Bem vindo!</h1>
      <p>Organize suas tarefas do dia.</p>
    </div>
    <div class="busca">
      <input type="text" placeholder="digite uma nova tarefa..." id="novatarefa" />
      <button type="button" id="adicionartarefa">Adicionar Tarefa</button>
    </div>

    <button type="button" class="login">sair</button>

    <div class="containerpai">
      <div class="container1">
        <h2>pendentes</h2>
        <div id="listapendentes"></div>
      </div>
      <div class="container2">
        <h2>Em andamento</h2>
        <div id="emandamento"></div>
      </div>
      <div class="container3">
        <h2>Concluidas</h2>
        <div id="concluidas"></div>
      </div>
    </div>
  </body>
</html>
